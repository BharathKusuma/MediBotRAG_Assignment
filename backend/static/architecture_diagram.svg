<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <linearGradient id="sqlCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="ragCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="rbacBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="qdrantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="respGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowSql" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowRag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title & Background Grid -->
  <rect x="0" y="0" width="1100" height="820" fill="#0b1120"/>
  <circle cx="550" cy="50" r="300" fill="#0284c7" opacity="0.08" filter="blur(60px)"/>
  <circle cx="250" cy="450" r="250" fill="#7c3aed" opacity="0.07" filter="blur(70px)"/>
  <circle cx="850" cy="450" r="250" fill="#059669" opacity="0.07" filter="blur(70px)"/>

  <!-- Main Title -->
  <text x="550" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">
    🏥 MediBot System Architecture &amp; Retrieval-Layer RBAC
  </text>
  <text x="550" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">
    Enterprise Healthcare AI Assistant with Dual RAG Engines &amp; Vector Database Security Guardrails
  </text>

  <!-- 1. Staff User Node -->
  <g transform="translate(375, 95)" filter="url(#glow)">
    <rect width="350" height="52" rx="26" fill="url(#userGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="175" y="32" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">
      👩‍⚕️ Staff User (Doctor / Nurse / Billing / Tech / Admin)
    </text>
  </g>

  <!-- Arrow: User -> API -->
  <path d="M 550 147 L 550 178" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="560" y="166" fill="#7dd3fc" font-size="11" font-weight="500">HTTP POST /chat + Auth Token</text>

  <!-- 2. FastAPI Gateway & Token Validator -->
  <g transform="translate(330, 180)" filter="url(#glow)">
    <rect width="440" height="54" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="220" y="26" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">
      ⚡ FastAPI Backend Gateway (/api/chat)
    </text>
    <text x="220" y="44" text-anchor="middle" fill="#94a3b8" font-size="11">
      Token Verification &amp; Role Extraction (doctor, nurse, billing, tech, admin)
    </text>
  </g>

  <!-- Arrow: API -> Intent Router -->
  <path d="M 550 234 L 550 264" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Intent Classifier Diamond/Pill -->
  <g transform="translate(380, 266)" filter="url(#glow)">
    <rect width="340" height="46" rx="23" fill="url(#routerGrad)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="170" y="28" text-anchor="middle" fill="#f0fdfa" font-size="13" font-weight="600">
      🔀 Query Intent Classifier &amp; Router
    </text>
  </g>

  <!-- Split Arrows -->
  <path d="M 430 312 L 275 365" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowSql)"/>
  <text x="270" y="335" fill="#d8b4fe" font-size="11" font-weight="600" text-anchor="end">
    Analytical / Claims / Stats
  </text>
  <text x="270" y="349" fill="#a855f7" font-size="10" text-anchor="end">
    (Billing &amp; Admin Only)
  </text>

  <path d="M 670 312 L 825 365" stroke="#34d399" stroke-width="2" marker-end="url(#arrowRag)"/>
  <text x="830" y="335" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="start">
    Clinical &amp; Operational Docs
  </text>
  <text x="830" y="349" fill="#10b981" font-size="10" text-anchor="start">
    (Protocols / Manuals / Policies)
  </text>

  <!-- ==================== LEFT COLUMN: SQL RAG ENGINE ==================== -->
  <g transform="translate(60, 370)" filter="url(#cardShadow)">
    <rect width="450" height="315" rx="14" fill="#0d1424" stroke="#7c3aed" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="450" height="38" rx="14" fill="#1e1b4b"/>
    <text x="20" y="24" fill="#c084fc" font-size="13" font-weight="700">
      📊 ENGINE A: SQL RAG Pipeline (Structured Data)
    </text>

    <!-- Step 1: RBAC Permission -->
    <g transform="translate(18, 52)">
      <rect width="414" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#ef4444"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">1</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">SQL RBAC Role Validation</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">Permits only 'billing_executive' &amp; 'admin'. Blocks other roles.</text>
    </g>

    <!-- Step 2: LLM NL to SQL -->
    <g transform="translate(18, 102)">
      <rect width="414" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#8b5cf6"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">2</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">NL-to-SQL Translation (LLM)</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">Generates dialect-aware SQLite query over claims &amp; tickets.</text>
    </g>

    <!-- Step 3: SQL Sanitizer -->
    <g transform="translate(18, 152)">
      <rect width="414" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#8b5cf6"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">3</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">SQL Security Sanitizer &amp; Safety Check</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">Enforces SELECT-only whitelist (Rejects DROP, DELETE, INSERT).</text>
    </g>

    <!-- Step 4: SQLite Execution -->
    <g transform="translate(18, 202)">
      <rect width="414" height="46" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.2"/>
      <circle cx="16" cy="23" r="9" fill="#a855f7"/>
      <text x="16" y="27" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">4</text>
      <text x="34" y="19" fill="#c084fc" font-size="11" font-weight="600">SQLite Database Engine (mediassist.db)</text>
      <text x="34" y="35" fill="#94a3b8" font-size="10">Executes safe query against 'claims' &amp; 'maintenance_tickets'.</text>
    </g>

    <!-- Step 5: LLM Synthesis -->
    <g transform="translate(18, 256)">
      <rect width="414" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#8b5cf6"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">5</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">LLM Natural Language Response Summary</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">Summarizes numeric data into professional staff insights.</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: HYBRID RAG & RBAC ENGINE ==================== -->
  <g transform="translate(590, 370)" filter="url(#cardShadow)">
    <rect width="450" height="315" rx="14" fill="#091817" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="450" height="38" rx="14" fill="#064e3b"/>
    <text x="20" y="24" fill="#6ee7b7" font-size="13" font-weight="700">
      📑 ENGINE B: Hybrid RAG &amp; Vector RBAC (Documents)
    </text>

    <!-- Step 1: Retrieval RBAC Filter -->
    <g transform="translate(18, 52)">
      <rect width="414" height="42" rx="6" fill="#0f2922" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="21" r="9" fill="#ef4444"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">1</text>
      <text x="34" y="18" fill="#34d399" font-size="11" font-weight="700">🔒 Qdrant Retrieval-Layer RBAC Filter</text>
      <text x="34" y="33" fill="#6ee7b7" font-size="10">must=[FieldCondition(access_roles=role)] (Zero data leakage)</text>
    </g>

    <!-- Step 2: Dense + Sparse Fusion -->
    <g transform="translate(18, 102)">
      <rect width="414" height="42" rx="6" fill="#132e27" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#10b981"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">2</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">Dense (384d) + Sparse BM25 Fusion</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">bge-small-en-v1.5 + BM25 combined via Reciprocal Rank Fusion (RRF).</text>
    </g>

    <!-- Step 3: Top-10 Retrieval -->
    <g transform="translate(18, 152)">
      <rect width="414" height="42" rx="6" fill="#132e27" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#10b981"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">3</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">Top-10 Candidate Chunks in Permitted Scope</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">Candidate pool physically limited to authorized collections only.</text>
    </g>

    <!-- Step 4: Cross-Encoder Reranking -->
    <g transform="translate(18, 202)">
      <rect width="414" height="46" rx="6" fill="#132e27" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="23" r="9" fill="#10b981"/>
      <text x="16" y="27" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">4</text>
      <text x="34" y="19" fill="#34d399" font-size="11" font-weight="600">Cross-Encoder Reranker (ms-marco-MiniLM)</text>
      <text x="34" y="35" fill="#94a3b8" font-size="10">Joint Query-Doc attention rescores pool down to Top-3 chunks.</text>
    </g>

    <!-- Step 5: LLM Context Synthesis -->
    <g transform="translate(18, 256)">
      <rect width="414" height="42" rx="6" fill="#132e27" stroke="#059669" stroke-width="1"/>
      <circle cx="16" cy="21" r="9" fill="#10b981"/>
      <text x="16" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">5</text>
      <text x="34" y="18" fill="#f1f5f9" font-size="11" font-weight="600">LLM Context Synthesis &amp; Precise Citations</text>
      <text x="34" y="33" fill="#94a3b8" font-size="10">Generates grounded answer with exact document &amp; section sources.</text>
    </g>
  </g>

  <!-- Arrows merging to Final Output -->
  <path d="M 285 685 L 285 718 L 470 718" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 815 685 L 815 718 L 630 718" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Structured Output Node -->
  <g transform="translate(290, 725)" filter="url(#glow)">
    <rect width="520" height="58" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="260" y="24" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">
      📦 Structured JSON Response &amp; Client View
    </text>
    <text x="260" y="44" text-anchor="middle" fill="#94a3b8" font-size="11">
      { answer, sources: [{doc, section, score}], retrieval_type, role, blocked_by_rbac }
    </text>
  </g>
</svg>
